[server]
maxUploadSize = 5
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#162033"
font = "sans serif"
baseRadius = "large"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F8FAFD"
secondaryBackgroundColor = "#EDF2F9"
